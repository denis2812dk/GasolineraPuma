name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    name: "swift test (business logic: cortes, bombas, validaciones)"
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          grep -E 'error:|XCTAssert.*failed' swift-test.log | while IFS= read -r line; do
            escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::${escaped}"
          done

  build-and-run:
    name: xcodebuild + iOS Simulator run (screenshot)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Pick an available iOS simulator
        id: sim
        run: |
          set -o pipefail
          LINE=$(xcrun simctl list devices available | grep -E "iPhone" | tail -n1)
          echo "Chosen simulator line: $LINE"
          DEVICE_ID=$(echo "$LINE" | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project FuelControl.xcodeproj \
            -scheme FuelControl \
            -destination "id=${{ steps.sim.outputs.device_id }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Surface compiler errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          grep -E ': error:' xcodebuild.log | while IFS= read -r line; do
            escaped=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::${escaped}"
          done
          echo "---- full xcodebuild tail (also in the uploaded artifact) ----"
          tail -n 200 xcodebuild.log
          exit 1

      - name: Boot simulator, install and launch the app
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          DEVICE_ID="${{ steps.sim.outputs.device_id }}"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="build/Build/Products/Debug-iphonesimulator/FuelControl.app"
          ls -la "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.fuelcontrol.app
          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/01-login.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload to Appetize.io for interactive testing
        if: steps.build.outcome == 'success' && env.APPETIZE_API_TOKEN != ''
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          set -o pipefail
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -X -q FuelControl.zip FuelControl.app
          cd -
          RESPONSE=$(curl -sS -X POST https://api.appetize.io/v1/apps \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@build/Build/Products/Debug-iphonesimulator/FuelControl.zip" \
            -F "platform=ios" \
            -F "note=CI run ${{ github.run_number }} - ${{ github.sha }}" \
            -F "appPermissions.run=public")
          echo "$RESPONSE"
          PUBLIC_KEY=$(echo "$RESPONSE" | jq -r '.publicKey // empty')
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::warning::Appetize upload did not return a publicKey. Check the response above."
          else
            URL="https://appetize.io/app/$PUBLIC_KEY"
            echo "Appetize session: $URL"
            {
              echo "## Probar interactivamente"
              echo
              echo "Corre la app de verdad, con toques, en el navegador:"
              echo
              echo "[$URL]($URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
